# Supabase CLI config. Regenerate/extend with `supabase init` if needed.
# Schema is owned by Drizzle (lib/proto/schema.ts) — this config is for the local dev stack only.
# Auth settings (Site URL, redirect allowlist, OAuth providers) are managed via the hosted
# project's dashboard, not this file — see .claude/skills/supabase/SKILL.md.

project_id = "be-my-sponsor"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = false
