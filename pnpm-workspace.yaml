# pnpm's settings file — NOT a monorepo declaration.
#
# There is no workspace here (no `packages:` key). Since pnpm 10 this is where
# per-project pnpm settings live: `package.json`'s `pnpm.onlyBuiltDependencies`
# is not read, and without this file every install fails with
# ERR_PNPM_IGNORED_BUILDS. Deleting it as "monorepo leftover" is a mistake that
# has already been made once.
#
# These ship native binaries or codegen that must run at install time:
# Tailwind's oxide engine, esbuild, sharp's image binary, core-js's postinstall,
# and workerd — the Cloudflare runtime `wrangler` runs the Worker on locally.
allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  core-js: true
  workerd: true
